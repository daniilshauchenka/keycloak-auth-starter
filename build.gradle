plugins {
    id 'io.spring.dependency-management' version "$springDependencyManagementVersion"
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

allprojects {
    group = 'by.softclub'
    version = '0.0.2-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    java { toolchain { languageVersion = JavaLanguageVersion.of(findProperty('javaVersion') as String) } }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            palantirJavaFormat('2.50.0')
            removeUnusedImports()
            importOrder('java', 'javax', 'org', 'by', 'com')
            custom('noWildcardImports') { source ->
                if (source =~ /(?m)^\s*import\s+static\s+[^;]*\.\*\s*;\s*$/ || source =~ /(?m)^\s*import\s+[^;]*\.\*\s*;\s*$/) {
                    throw new AssertionError("Wildcard imports are forbidden. Use explicit imports.")
                }
                return source
            }
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    dependencyManagement {
        imports { mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}" }
    }
}
